<div style="padding: 24px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
  
  <h2>📚 Matérias e disciplinas</h2>
  <p style="color: #666;">Cadastre, revise e edite os nomes das matérias usadas nos seus registros.</p>

  <section class="categorias-topo">
    <h3>Categorias</h3>
    <div class="categorias-abas">
      <button
        nz-button
        [nzType]="categoriaSelecionadaId === null ? 'primary' : 'default'"
        (click)="selecionarCategoria(null)">
        Todas
      </button>
      <button
        *ngFor="let categoria of listaCategorias"
        nz-button
        [nzType]="categoriaSelecionadaId === categoria.id ? 'primary' : 'default'"
        (click)="selecionarCategoria(categoria.id)">
        {{ categoria.nome }}
      </button>
    </div>
  </section>

  <h3>Disciplinas</h3>

  <hr style="border: 0; border-top: 1px solid #f0f0f0; margin: 20px 0;">

  <form nz-form [nzLayout]="'inline'" [formGroup]="validateForm" (ngSubmit)="submitForm()" style="margin-bottom: 30px; gap: 16px;">
    
    <nz-form-item style="flex: 1; min-width: 250px;">
      <nz-form-control nzErrorTip="Por favor, digite o nome da matéria!">
        <nz-input-group nzPrefixIcon="book">
          <input type="text" nz-input formControlName="nome" placeholder="Ex: Direito Constitucional, Java, Francês" />
        </nz-input-group>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item style="flex: 1; min-width: 250px;">
      <nz-form-control nzErrorTip="Selecione ao menos uma categoria!">
        <nz-select formControlName="categorias" nzMode="multiple" nzPlaceHolder="Selecione as categorias" style="min-width: 250px;">
          <nz-option *ngFor="let categoria of listaCategorias" [nzValue]="categoria.id" [nzLabel]="categoria.nome"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-control>
        <button nz-button nzType="primary" [nzLoading]="salvando">
          ⚡ Adicionar Matéria
        </button>
      </nz-form-control>
    </nz-form-item>
  </form>

  <nz-table #basicTable [nzData]="materiasExibidas()" [nzLoading]="carregando" nzBordered>
    <thead>
      <tr>
        <th width="80px">ID</th>
        <th>Nome da Matéria</th>
        <th>Categorias de Estudo</th>
        <th nzWidth="180px">Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of basicTable.data">
        <td>{{ data.id }}</td>
        <td>
          <ng-container *ngIf="editandoId !== data.id; else editarNome">
            <button nz-button nzType="link" (click)="selecionarMateria(data)">
              <strong>{{ data.nome }}</strong>
            </button>
            <div class="assuntos" *ngIf="materiaSelecionadaId === data.id">
              <span *ngIf="assuntosCarregando">Carregando assuntos...</span>
              <span *ngIf="!assuntosCarregando && !assuntosDaMateria.length">Nenhum assunto cadastrado.</span>
              <div class="assunto" *ngFor="let assunto of assuntosDaMateria; trackBy: trackByAssuntoId" [hidden]="assuntosCarregando">
                <ng-container *ngIf="assuntoEditandoId !== assunto.id; else editarAssunto">
                  <span>{{ assunto.nome }}</span>
                  <button nz-button nzType="link" nzSize="small" (click)="iniciarEdicaoAssunto(assunto)">Editar</button>
                </ng-container>
                <ng-template #editarAssunto>
                  <input nz-input [(ngModel)]="nomeAssuntoEdicao" [ngModelOptions]="{standalone: true}" />
                  <button nz-button nzType="primary" nzSize="small" (click)="salvarEdicaoAssunto(assunto)">Salvar</button>
                  <button nz-button nzType="link" nzSize="small" (click)="cancelarEdicaoAssunto()">Cancelar</button>
                </ng-template>
              </div>
            </div>
          </ng-container>
          <ng-template #editarNome>
            <input nz-input [(ngModel)]="formularioEdicao.nome" placeholder="Nome da matéria" />
          </ng-template>
        </td>
        <td>
          <ng-container *ngIf="editandoId !== data.id; else editarCategorias">
            <nz-tag *ngFor="let tag of converterCategorias(data.categorias)" nzColor="blue">{{ tag }}</nz-tag>
            <span *ngIf="!data.categorias" style="color: #999; font-style: italic;">Nenhuma</span>
          </ng-container>
          <ng-template #editarCategorias>
            <nz-select [(ngModel)]="formularioEdicao.categorias" [ngModelOptions]="{standalone: true}" nzMode="multiple" nzPlaceHolder="Selecione as categorias" style="min-width: 250px;">
              <nz-option *ngFor="let categoria of listaCategorias" [nzValue]="categoria.id" [nzLabel]="categoria.nome"></nz-option>
            </nz-select>
          </ng-template>
        </td>
        <td>
          <ng-container *ngIf="editandoId !== data.id; else botoesEdicao">
            <button nz-button nzType="link" (click)="iniciarEdicao(data)">✏️ Editar</button>
          </ng-container>
          <ng-template #botoesEdicao>
            <button nz-button nzType="primary" nzSize="small" [nzLoading]="salvando" (click)="salvarEdicao(data)">Salvar</button>
            <button nz-button nzType="link" (click)="cancelarEdicao()">Cancelar</button>
          </ng-template>
        </td>
      </tr>
    </tbody>
  </nz-table>
</div>
